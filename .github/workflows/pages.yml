name: Deploy MycoMy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Prepare static site
        shell: bash
        run: |
          mkdir -p _site
          cp \
            index.html \
            styles.css \
            app.js \
            sw.js \
            manifest.webmanifest \
            bdforet57.json \
            bdforet68.json \
            bdforet-chatel.json \
            bdforet-hayange.json \
            context68.json \
            hydro57.json \
            hydro68.json \
            hydro-chatel.json \
            hydro-hayange.json \
            observations57.json \
            observations68.json \
            observations-chatel.json \
            observations-hayange.json \
            _site/
          touch _site/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
